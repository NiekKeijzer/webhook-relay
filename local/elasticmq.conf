# Queues of the local setup (compose.yaml). A queue's defaultVisibilityTimeout
# must match RELAY_QUEUE_VISIBILITY_TIMEOUT_SECONDS.
include classpath("application.conf")

queues {
  relay {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "relay-dead-letters"
      maxReceiveCount = 5
    }
  }
  relay-dead-letters {}

  # For TestElasticMQ in queue/sqs.
  relay-test {
    defaultVisibilityTimeout = 1 seconds
    deadLettersQueue {
      name = "relay-test-dead-letters"
      maxReceiveCount = 2
    }
  }
  relay-test-dead-letters {}
}
