name: Test and build


on:
  push:
    branches: ["main"]
    tags: ["v*"]

  pull_request:
    branches: ["main"]


permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Also runs TestElasticMQ in queue/sqs, against the relay-test queue in local/elasticmq.conf
      - name: Start ElasticMQ
        run: docker compose up --detach --wait elasticmq

      - name: Test
        env:
          RELAY_TEST_SQS_QUEUE_URL: http://localhost:9324/000000000000/relay-test
        run: go test -race ./...


  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No QEMU: the Dockerfile cross-compiles on the build platform
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine optional registry targets
        id: registries
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -euo pipefail

          # Image references must be lowercase; GitHub usernames/orgs may contain uppercase letters
          owner_lc="$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(echo "${REPOSITORY_NAME}" | tr '[:upper:]' '[:lower:]')"

          ghcr_image="ghcr.io/${owner_lc}/${repo_lc}"
          echo "ghcr_image=${ghcr_image}" >> "$GITHUB_OUTPUT"

          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            dockerhub_user_lc="$(echo "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]')"
            dockerhub_repo="${DOCKERHUB_REPOSITORY:-${dockerhub_user_lc}/${repo_lc}}"
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
            echo "dockerhub_image=${dockerhub_repo}" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
            echo "dockerhub_image=" >> "$GITHUB_OUTPUT"
          fi

      # v1.2.3 -> 1.2.3, 1.2, 1, latest; main -> main, sha-<short>; pull requests -> no tags
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.registries.outputs.ghcr_image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # No "0" tag: major version zero makes no stability promise
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=sha,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && steps.registries.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup crane
        if: github.event_name != 'pull_request' && steps.registries.outputs.dockerhub_enabled == 'true'
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Mirror image to Docker Hub
        if: github.event_name != 'pull_request' && steps.registries.outputs.dockerhub_enabled == 'true'
        id: dockerhub_mirror
        shell: bash
        env:
          DOCKERHUB_IMAGE: ${{ steps.registries.outputs.dockerhub_image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            crane copy "${ref}" "${DOCKERHUB_IMAGE}:${ref##*:}"
          done <<< "$TAGS"

      # Needs DOCKERHUB_TOKEN with Read, Write, Delete scope
      - name: Update Docker Hub overview
        if: github.ref == 'refs/heads/main' && steps.registries.outputs.dockerhub_enabled == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.registries.outputs.dockerhub_image }}
          readme-filepath: ./README.md
          enable-url-completion: true

      - name: Write build summary
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DOCKERHUB_ENABLED: ${{ steps.registries.outputs.dockerhub_enabled }}
          DOCKERHUB_IMAGE: ${{ steps.registries.outputs.dockerhub_image }}
          DOCKERHUB_MIRROR_OUTCOME: ${{ steps.dockerhub_mirror.outcome }}
        run: |
          {
            printf '### Image\n'
            if [ "$EVENT_NAME" = "pull_request" ]; then
              printf -- "- Validation build only. No image was pushed.\n"
            elif [ "$BUILD_OUTCOME" != "success" ]; then
              printf -- "- Build did not complete successfully. No image was pushed.\n"
            else
              while IFS= read -r ref; do
                [ -n "$ref" ] || continue
                printf -- "- \`%s\`\n" "$ref"
              done <<< "$TAGS"
            fi
            printf '\n### Docker Hub Mirror\n'
            if [ "$EVENT_NAME" = "pull_request" ]; then
              printf -- "- Skipped for pull request validation.\n"
            elif [ "$DOCKERHUB_ENABLED" != "true" ]; then
              printf -- "- Skipped: set the \`DOCKERHUB_USERNAME\` repository variable and \`DOCKERHUB_TOKEN\` repository secret to enable Docker Hub publishing.\n"
            elif [ "$DOCKERHUB_MIRROR_OUTCOME" = "success" ]; then
              while IFS= read -r ref; do
                [ -n "$ref" ] || continue
                printf -- "- \`%s:%s\`\n" "$DOCKERHUB_IMAGE" "${ref##*:}"
              done <<< "$TAGS"
            else
              printf -- "- Mirror was not completed.\n"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
